<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eltuvchi Express</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Maxsus Fon Mavzulari */
        body.theme-default { background-color: #f8fafc; color: #0f172a; }
        body.theme-dark { background-color: #0f172a; color: #f8fafc; }
        body.theme-gold { background-color: #fefce8; color: #422006; }
        body.theme-green { background-color: #f0fdf4; color: #052e16; }

        /* Mavzuga mos kartochkalar */
        body.theme-dark .card-bg { background-color: #1e293b; border-color: #334155; }
        body.theme-dark .text-title { color: #f8fafc; }
        body.theme-dark .text-sub { color: #94a3b8; }
        
        body.theme-gold .card-bg { background-color: #fffbeb; border-color: #fef08a; }
        body.theme-gold .text-title { color: #713f12; }
        body.theme-gold .text-sub { color: #a16207; }

        body.theme-green .card-bg { background-color: #dc26260d; background-color: #ffffff; border-color: #bbf7d0; }
        body.theme-green .text-title { color: #14532d; }
        body.theme-green .text-sub { color: #15803d; }

        body.theme-default .card-bg { background-color: #ffffff; border-color: #f1f5f9; }
        body.theme-default .text-title { color: #0f172a; }
        body.theme-default .text-sub { color: #64748b; }

        /* No-scrollbar yordamchi CSS */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body id="main-body" class="theme-default min-h-screen antialiased selection:bg-amber-500 selection:text-white pb-24 transition-colors duration-300">

    <!-- Birinchi Kirganda Chiqadigan Splash / Welcome Screen -->
    <div id="splash-screen" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-6 text-center transition-opacity duration-500">
        <div class="relative mb-6">
            <div class="absolute -inset-1 bg-gradient-to-r from-amber-500 to-amber-300 rounded-full blur opacity-50 animate-pulse"></div>
            <img src="/static/images/logo.png" onerror="this.src='https://via.placeholder.com/120?text=Eltuvchi'" alt="Eltuvchi Express Logo" class="relative w-28 h-28 object-contain rounded-3xl shadow-2xl bg-white p-2">
        </div>
        <h1 class="text-2xl font-black text-white tracking-tight mb-2">Eltuvchi Express</h1>
        <p class="text-xs font-semibold text-amber-400 max-w-xs leading-relaxed mb-8">Xizmatimizga Xush Kelibsiz!</p>
        <div class="w-8 h-8 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <!-- Brending Header / Logo va Rejimlar -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-40 shadow-sm transition-colors duration-300" id="app-header">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2.5 cursor-pointer" onclick="goHome()">
                <img src="/static/images/logo.png" onerror="this.style.display='none'" alt="Logo" class="w-9 h-9 object-contain rounded-xl">
                <div>
                    <div class="font-black text-base text-slate-900 tracking-tight leading-none">ELTUVCHI</div>
                    <div class="text-[10px] font-extrabold text-amber-500 tracking-widest leading-none mt-0.5">EXPRESS</div>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <!-- Fon Rangini O'zgartirish Tugmasi -->
                <button onclick="toggleThemeMenu()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 w-9 h-9 rounded-2xl flex items-center justify-center transition-all active:scale-95">
                    <i class="fa-solid fa-palette text-sm"></i>
                </button>
                <!-- Profil Tugmasi -->
                <button id="profile-btn" class="hidden bg-slate-100 hover:bg-slate-200 text-slate-700 w-9 h-9 rounded-2xl flex items-center justify-center transition-all active:scale-95" onclick="openProfile()">
                    <i class="fa-solid fa-user-gear text-sm"></i>
                </button>
            </div>
        </div>

        <!-- Fon Ranglarini Tanlash Menyusi -->
        <div id="theme-menu" class="hidden bg-white border-t border-slate-100 px-4 py-3 flex justify-around items-center text-xs font-bold shadow-inner">
            <button onclick="setTheme('theme-default')" class="flex items-center space-x-1 px-2.5 py-1.5 rounded-xl bg-slate-100 text-slate-700">
                <span class="w-3 h-3 rounded-full bg-slate-200 border"></span>
                <span>Standart</span>
            </button>
            <button onclick="setTheme('theme-dark')" class="flex items-center space-x-1 px-2.5 py-1.5 rounded-xl bg-slate-800 text-white">
                <span class="w-3 h-3 rounded-full bg-slate-900"></span>
                <span>Tungi</span>
            </button>
            <button onclick="setTheme('theme-gold')" class="flex items-center space-x-1 px-2.5 py-1.5 rounded-xl bg-amber-100 text-amber-900">
                <span class="w-3 h-3 rounded-full bg-amber-400"></span>
                <span>Oltin</span>
            </button>
            <button onclick="setTheme('theme-green')" class="flex items-center space-x-1 px-2.5 py-1.5 rounded-xl bg-emerald-100 text-emerald-900">
                <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                <span>Yashil</span>
            </button>
        </div>
    </header>

    <!-- Asosiy Konteyner -->
    <main id="app" class="max-w-md mx-auto p-4">
        <div id="loading" class="flex flex-col items-center justify-center py-20 space-y-3">
            <div class="w-9 h-9 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-xs font-semibold text-slate-400">Yuklanmoqda...</p>
        </div>
    </main>

    <!-- Pastda Doim Ko'rinadigan Savat Paneli -->
    <div id="cart-bar" class="hidden fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-slate-900 text-white p-3.5 rounded-2xl shadow-2xl flex justify-between items-center cursor-pointer transition-all duration-300 active:scale-95 z-50 border border-slate-800" onclick="openCart()">
        <div class="flex items-center space-x-3">
            <div class="bg-amber-500 text-white w-10 h-10 rounded-xl flex items-center justify-center font-bold shadow-md shadow-amber-500/30">
                <i class="fa-solid fa-basket-shopping text-sm"></i>
            </div>
            <div>
                <span id="cart-summary" class="font-black text-sm block leading-tight"></span>
                <span class="text-[11px] text-amber-400 font-medium">Buyurtmani rasmiylashtirish →</span>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }
        const initData = tg ? tg.initData : "";

        let currentUser = null;
        let currentCityId = null;
        let currentCityName = "Shaharni tanlang";
        let allCities = [];
        let currentPartnerId = null;
        let currentPartnerName = "";
        let products = [];
        let cart = {};

        // Filtr va Keshbek holatlari
        let selectedCategory = "Barchasi";
        let searchQuery = "";
        let useCashback = false;

        // Mavzuni yuklash va saqlash
        function setTheme(themeName) {
            document.getElementById("main-body").className = `${themeName} min-h-screen antialiased selection:bg-amber-500 selection:text-white pb-24 transition-colors duration-300`;
            localStorage.setItem("app_theme", themeName);
            document.getElementById("theme-menu").classList.add("hidden");
        }

        function toggleThemeMenu() {
            document.getElementById("theme-menu").classList.toggle("hidden");
        }

        const savedTheme = localStorage.getItem("app_theme") || "theme-default";
        setTheme(savedTheme);

        async function api(path, body) {
            const res = await fetch(`/api/shop${path}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ init_data: initData, ...body }),
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({ detail: "Xatolik" }));
                throw new Error(err.detail || "Xatolik yuz berdi");
            }
            return res.json();
        }

        async function apiGet(path) {
            const res = await fetch(`/api/shop${path}`);
            if (!res.ok) throw new Error("Xatolik yuz berdi");
            return res.json();
        }

        function renderLoading(msg) {
            document.getElementById("app").innerHTML = `
                <div class="flex flex-col items-center justify-center py-20 space-y-3">
                    <div class="w-9 h-9 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-xs font-semibold text-sub">${msg}</p>
                </div>`;
        }

        function renderNeedsBotStart() {
            document.getElementById("profile-btn").classList.add("hidden");
            document.getElementById("app").innerHTML = `
                <div class="text-center py-12 card-bg rounded-3xl p-6 shadow-sm border my-4">
                    <div class="w-16 h-16 bg-amber-50 text-amber-500 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                        <i class="fa-solid fa-id-card"></i>
                    </div>
                    <h2 class="text-xl font-black text-title mb-2">Ro'yxatdan o'ting</h2>
                    <p class="text-xs text-sub mb-6 leading-relaxed">Xizmatlarimizdan foydalanish va buyurtma berish uchun, iltimos, bot orqali telefon raqamingizni tasdiqlang.</p>
                    <div class="p-3.5 bg-amber-500/10 rounded-2xl text-xs text-title font-bold border border-amber-500/20 flex items-center space-x-2">
                        <i class="fa-solid fa-paper-plane text-amber-500 text-sm"></i>
                        <span>Bot chatiga qaytib, "📱 Telefon raqamni ulashish" tugmasini bosing.</span>
                    </div>
                </div>`;
        }

        async function init() {
            // Splash Screenni yopish (1.5 soniyadan keyin)
            setTimeout(() => {
                const splash = document.getElementById("splash-screen");
                if (splash) {
                    splash.classList.add("opacity-0");
                    setTimeout(() => splash.remove(), 500);
                }
            }, 1500);

            if (!tg || !initData) {
                renderLoading("Bu sahifa faqat Telegram ilovasi ichida ishlaydi.");
                return;
            }
            try {
                const me = await api("/me", {});
                currentUser = me;
                if (!me.registered) {
                    renderNeedsBotStart();
                    return;
                }
                
                document.getElementById("profile-btn").classList.remove("hidden");
                allCities = me.cities || [];

                if (!me.city_id) {
                    renderCitySelect(allCities);
                } else {
                    currentCityId = me.city_id;
                    const foundCity = allCities.find(c => c.id === currentCityId);
                    if (foundCity) currentCityName = foundCity.name;
                    await loadPartners();
                }
            } catch (e) {
                renderLoading("Xatolik: " + e.message);
            }
        }

        function goHome() {
            if (currentCityId) {
                loadPartners();
            } else if (allCities.length > 0) {
                renderCitySelect(allCities);
            }
        }

        function openProfile() {
            if (!currentUser) return;
            const app = document.getElementById("app");
            const cashback = (currentUser.cashback_balance || 0).toLocaleString();
            const refCode = currentUser.referral_code || "";
            const refLink = `https://t.me/EltuvchiExpressBot?start=${refCode}`;

            const userFirstName = currentUser.first_name || '';
            const userBirthDate = currentUser.birth_date || '';
            const userPhone = currentUser.phone || '—';

            app.innerHTML = `
                <div class="mb-4 flex items-center justify-between">
                    <button class="flex items-center text-xs font-bold text-amber-600 bg-amber-50 px-3 py-2 rounded-xl" onclick="goHome()">
                        <i class="fa-solid fa-arrow-left mr-1.5"></i> Qaytish
                    </button>
                    <span class="text-xs font-black text-sub uppercase tracking-widest">Shaxsiy Kabinet</span>
                </div>

                <!-- Keshbek Kartochkasi -->
                <div class="bg-gradient-to-tr from-slate-900 via-slate-800 to-slate-900 text-white p-5 rounded-3xl shadow-xl mb-4 relative overflow-hidden border border-slate-700">
                    <div class="text-[11px] font-extrabold uppercase tracking-wider text-amber-400 mb-1">Keshbek Balans</div>
                    <div class="text-3xl font-black tracking-tight mb-4">${cashback} <span class="text-sm font-bold text-slate-300">so'm</span></div>
                    <div class="flex items-center justify-between bg-white/10 backdrop-blur-md p-3 rounded-2xl text-xs font-medium border border-white/5">
                        <span class="text-slate-300">Har bir buyurtmadan keshbek toplanadi</span>
                        <i class="fa-solid fa-gift text-amber-400 text-sm"></i>
                    </div>
                </div>

                <!-- Foydalanuvchi Ma'lumotlarini Tahrirlash -->
                <div class="card-bg p-4 rounded-2xl shadow-sm border mb-4 space-y-3">
                    <h3 class="text-xs font-black text-title uppercase tracking-wider mb-2">Shaxsiy Ma'lumotlar</h3>
                    <div>
                        <label class="block text-[11px] font-semibold text-sub mb-1">Telefon raqam (O'zgartirib bo'lmaydi)</label>
                        <input type="text" readonly value="${userPhone}" class="w-full p-2.5 bg-slate-500/10 border rounded-xl text-xs font-bold text-sub focus:outline-none cursor-not-allowed">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-sub mb-1">Ismingiz</label>
                        <input id="profile-first-name" type="text" value="${userFirstName}" placeholder="Ismingizni kiriting" class="w-full p-2.5 bg-slate-500/10 border rounded-xl text-xs font-bold text-title focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-sub mb-1">Tug'ilgan kun</label>
                        <input id="profile-birth-date" type="date" value="${userBirthDate}" class="w-full p-2.5 bg-slate-500/10 border rounded-xl text-xs font-bold text-title focus:outline-none focus:border-amber-500">
                    </div>
                    <button onclick="updateProfile()" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-95 text-white py-2.5 rounded-xl text-xs font-bold transition-all shadow-md shadow-amber-200 flex justify-center items-center space-x-1.5 mt-2">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span>Saqlash</span>
                    </button>
                </div>

                <!-- Referal Tizimi -->
                <div class="card-bg p-4 rounded-2xl shadow-sm border mb-4">
                    <label class="block text-xs font-bold text-title mb-1.5">🎁 Do'stlarni taklif qiling</label>
                    <p class="text-[11px] text-sub mb-3">Sizning referal havolangiz orqali kirgan do'stlaringiz uchun bonus olasiz.</p>
                    <div class="flex items-center space-x-2">
                        <input type="text" readonly value="${refLink}" class="w-full p-2.5 bg-slate-500/10 border rounded-xl text-xs font-mono text-title focus:outline-none">
                        <button onclick="copyLink('${refLink}')" class="bg-amber-500 hover:bg-amber-600 active:scale-95 text-white px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all shadow-md shadow-amber-200">
                            Nusxalash
                        </button>
                    </div>
                </div>`;
        }

        async function updateProfile() {
            const firstName = document.getElementById("profile-first-name").value.trim();
            const birthDate = document.getElementById("profile-birth-date").value;

            try {
                const res = await api("/profile/update", {
                    first_name: firstName,
                    birth_date: birthDate
                });
                currentUser.first_name = firstName;
                currentUser.birth_date = birthDate;
                alert(res.message || "Ma'lumotlar saqlandi!");
            } catch (e) {
                alert("Xatolik: " + e.message);
            }
        }

        function copyLink(text) {
            navigator.clipboard.writeText(text);
            alert("Referal havola nusxalandi!");
        }

        function renderCitySelect(cities) {
            document.getElementById("app").innerHTML = `
                <div class="mb-5">
                    <h1 class="text-xl font-black text-title tracking-tight">📍 Shaharni tanlang</h1>
                    <p class="text-xs text-sub mt-0.5">Xizmat ko'rsatilish hududini belgilang</p>
                </div>
                <div class="space-y-2" id="city-list"></div>`;
            const list = document.getElementById("city-list");
            cities.forEach(c => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-4 card-bg active:scale-[0.99] rounded-2xl shadow-sm border font-bold text-title flex justify-between items-center transition-all";
                btn.innerHTML = `<span>${c.name}</span><i class="fa-solid fa-chevron-right text-xs text-sub"></i>`;
                btn.onclick = async () => {
                    await api("/set-city", { city_id: c.id });
                    currentCityId = c.id;
                    currentCityName = c.name;
                    await loadPartners();
                };
                list.appendChild(btn);
            });
        }

        async function loadPartners() {
            renderLoading("Do'konlar yuklanmoqda...");
            const partners = await apiGet(`/partners?city_id=${currentCityId}`);
            const app = document.getElementById("app");
            
            app.innerHTML = `
                <div class="flex justify-between items-center card-bg p-3 rounded-2xl shadow-sm border mb-4">
                    <div class="flex items-center space-x-2 overflow-hidden">
                        <div class="w-7 h-7 bg-amber-50 text-amber-500 rounded-lg flex items-center justify-center text-xs">
                            <i class="fa-solid fa-location-dot"></i>
                        </div>
                        <span class="font-bold text-xs text-title truncate">${currentCityName}</span>
                    </div>
                    <button onclick="changeCityPrompt()" class="text-[11px] font-bold text-amber-600 bg-amber-50 hover:bg-amber-100 px-2.5 py-1 rounded-xl transition-all">
                        O'zgartirish
                    </button>
                </div>

                <h1 class="text-lg font-black text-title mb-3">🏪 Muassasalar</h1>
                <div class="space-y-2.5" id="partner-list"></div>`;

            const list = document.getElementById("partner-list");
            if (partners.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-12 card-bg rounded-2xl border border-dashed p-4">
                        <i class="fa-solid fa-store-slash text-2xl text-sub mb-2"></i>
                        <p class="text-xs text-sub font-medium">Hozircha bu shaharda ochiq do'kon yo'q.</p>
                    </div>`;
                return;
            }
            partners.forEach(p => {
                const card = document.createElement("button");
                card.className = "w-full text-left p-4 card-bg rounded-2xl shadow-sm border transition-all duration-200 active:scale-[0.99]";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <div class="font-black text-sm text-title">${p.name}</div>
                        <span class="text-[9px] uppercase font-bold tracking-wider bg-slate-500/10 text-title px-2 py-0.5 rounded-md">${p.category || "Restoran"}</span>
                    </div>
                    <div class="text-xs text-sub flex items-center space-x-1">
                        <i class="fa-solid fa-map-pin text-[10px]"></i>
                        <span class="truncate">${p.address || "Manzil ko'rsatilmagan"}</span>
                    </div>`;
                card.onclick = () => loadProducts(p.id, p.name);
                list.appendChild(card);
            });
        }

        async function changeCityPrompt() {
            if (allCities.length === 0 && currentUser) {
                allCities = currentUser.cities || [];
            }
            renderCitySelect(allCities);
        }

        async function loadProducts(partnerId, partnerName) {
            currentPartnerId = partnerId;
            currentPartnerName = partnerName;
            renderLoading("Menyu yuklanmoqda...");
            products = await apiGet(`/products?partner_id=${partnerId}`);

            selectedCategory = "Barchasi";
            searchQuery = "";

            renderProductInterface();
            updateCartBar();
        }

        function renderProductInterface() {
            const app = document.getElementById("app");

            // Kategoriyalarni yig'ib olish
            const categories = ["Barchasi", ...new Set(products.map(p => p.category || "Boshqa"))];

            app.innerHTML = `
                <button class="flex items-center text-xs font-bold text-amber-600 bg-amber-50 px-3 py-1.5 rounded-xl mb-3" onclick="loadPartners()">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i> Do'konlarga qaytish
                </button>
                <h1 class="text-xl font-black text-title mb-3">${currentPartnerName}</h1>
                
                <!-- Qidiruv Inputi -->
                <div class="relative mb-3">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-sub text-xs"></i>
                    <input id="search-input" type="text" value="${searchQuery}" placeholder="Mahsulotlarni izlash..." class="w-full pl-9 pr-3 py-2.5 card-bg border rounded-2xl text-xs font-medium text-title focus:outline-none focus:border-amber-500 transition-all shadow-sm">
                </div>

                <!-- Kategoriya Tugmalari -->
                <div class="flex space-x-2 overflow-x-auto no-scrollbar mb-4 pb-1" id="category-bar">
                    ${categories.map(cat => `
                        <button onclick="filterCategory('${cat}')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${selectedCategory === cat ? 'bg-amber-500 text-white shadow-sm shadow-amber-200' : 'card-bg border text-sub hover:text-title'}">
                            ${cat}
                        </button>
                    `).join('')}
                </div>

                <div class="space-y-2.5" id="product-list"></div>`;

            document.getElementById("search-input").addEventListener("input", (e) => {
                searchQuery = e.target.value.toLowerCase();
                filterAndRenderProducts();
            });

            filterAndRenderProducts();
        }

        function filterCategory(cat) {
            selectedCategory = cat;
            renderProductInterface();
        }

        function filterAndRenderProducts() {
            const list = document.getElementById("product-list");
            if (!list) return;

            const filtered = products.filter(p => {
                const matchesCat = selectedCategory === "Barchasi" || (p.category || "Boshqa") === selectedCategory;
                const matchesSearch = p.name.toLowerCase().includes(searchQuery) || (p.description && p.description.toLowerCase().includes(searchQuery));
                return matchesCat && matchesSearch;
            });

            list.innerHTML = "";

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-12 card-bg rounded-2xl border border-dashed p-4">
                        <i class="fa-solid fa-box-open text-2xl text-sub mb-2"></i>
                        <p class="text-xs text-sub font-medium">Mahsulot topilmadi.</p>
                    </div>`;
                return;
            }

            filtered.forEach(p => {
                const row = document.createElement("div");
                row.className = "p-3.5 card-bg rounded-2xl shadow-sm border flex justify-between items-center space-x-3";
                row.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <div class="font-bold text-xs text-title truncate">${p.name}</div>
                        <div class="text-[11px] text-sub line-clamp-2 mt-0.5">${p.description || ""}</div>
                        <div class="text-xs font-black text-amber-600 mt-1.5">${p.price.toLocaleString()} so'm</div>
                    </div>
                    <button class="bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white px-3 py-2 rounded-xl text-xs font-bold shadow-sm shadow-amber-200 transition-all active:scale-95 flex-shrink-0" onclick='addToCart(${JSON.stringify(p)})'>
                        + Qo'shish
                    </button>`;
                list.appendChild(row);
            });
        }

        function addToCart(product) {
            if (!cart[product.id]) cart[product.id] = { product, qty: 0 };
            cart[product.id].qty += 1;
            updateCartBar();
        }

        function updateCartBar() {
            const items = Object.values(cart);
            const bar = document.getElementById("cart-bar");
            if (items.length === 0) { bar.classList.add("hidden"); return; }
            const total = items.reduce((s, i) => s + i.product.price * i.qty, 0);
            const count = items.reduce((s, i) => s + i.qty, 0);
            document.getElementById("cart-summary").textContent = `${count} ta mahsulot — ${total.toLocaleString()} so'm`;
            bar.classList.remove("hidden");
        }

        function openCart() {
            const items = Object.values(cart);
            const app = document.getElementById("app");
            const originalTotal = items.reduce((s, i) => s + i.product.price * i.qty, 0);

            const userCashback = currentUser?.cashback_balance || 0;
            const canUseCashback = userCashback > 0;

            let discount = 0;
            if (useCashback && canUseCashback) {
                discount = Math.min(userCashback, originalTotal);
            }
            const finalTotal = Math.max(0, originalTotal - discount);

            app.innerHTML = `
                <button class="flex items-center text-xs font-bold text-amber-600 bg-amber-50 px-3 py-1.5 rounded-xl mb-3" onclick="loadProducts(currentPartnerId, currentPartnerName)">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i> Menyuga qaytish
                </button>
                <h1 class="text-xl font-black text-title mb-3">🛒 Savatingiz</h1>
                <div class="space-y-2 mb-4" id="cart-items"></div>
                
                <div class="card-bg p-4 rounded-2xl shadow-sm border mb-4 space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-title mb-1">Yetkazib berish manzili</label>
                        <input id="delivery-address" type="text" placeholder="Masalan: Navoiy ko'chasi, 12-uy" class="w-full p-3 bg-slate-500/10 border rounded-xl text-xs font-medium text-title focus:outline-none focus:border-amber-500 transition-all">
                    </div>

                    <!-- Keshbek Islatish Toggle Switch -->
                    ${canUseCashback ? `
                    <div class="border-t border-slate-100/10 pt-3 flex justify-between items-center">
                        <div>
                            <div class="text-xs font-bold text-title">Keshbekdan foydalanish</div>
                            <div class="text-[10px] text-sub">Mavjud: ${userCashback.toLocaleString()} so'm</div>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="cashback-toggle" class="sr-only peer" ${useCashback ? 'checked' : ''} onchange="toggleCashbackUse(this.checked)">
                            <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-amber-500"></div>
                        </label>
                    </div>
                    ` : ''}

                    <div class="border-t border-slate-100/10 pt-3 space-y-1">
                        <div class="flex justify-between items-center text-xs text-sub">
                            <span>Mahsulotlar summasi:</span>
                            <span>${originalTotal.toLocaleString()} so'm</span>
                        </div>
                        ${useCashback && discount > 0 ? `
                        <div class="flex justify-between items-center text-xs text-emerald-600 font-bold">
                            <span>Keshbek chegirmasi:</span>
                            <span>-${discount.toLocaleString()} so'm</span>
                        </div>
                        ` : ''}
                        <div class="flex justify-between items-center font-bold pt-1">
                            <span class="text-xs text-sub">Jami to'lov:</span>
                            <span class="text-base text-amber-600 font-black">${finalTotal.toLocaleString()} so'm</span>
                        </div>
                    </div>
                </div>

                <button onclick="placeOrder()" class="w-full bg-slate-900 active:bg-slate-800 text-white py-3.5 rounded-2xl font-bold shadow-xl transition-all active:scale-[0.98] flex justify-center items-center space-x-2">
                    <i class="fa-solid fa-circle-check text-amber-400"></i>
                    <span class="text-xs">Buyurtmani tasdiqlash</span>
                </button>`;

            const list = document.getElementById("cart-items");
            items.forEach(i => {
                const row = document.createElement("div");
                row.className = "p-3 card-bg rounded-2xl shadow-sm border flex justify-between items-center";
                row.innerHTML = `
                    <div class="text-xs font-bold text-title">${i.product.name}</div>
                    <div class="flex items-center space-x-2">
                        <button class="w-7 h-7 bg-slate-500/10 active:bg-slate-500/20 rounded-lg font-bold text-title transition-all flex items-center justify-center text-xs" onclick="changeQty(${i.product.id}, -1)">−</button>
                        <span class="text-xs font-bold w-5 text-center text-title">${i.qty}</span>
                        <button class="w-7 h-7 bg-slate-500/10 active:bg-slate-500/20 rounded-lg font-bold text-title transition-all flex items-center justify-center text-xs" onclick="changeQty(${i.product.id}, 1)">+</button>
                    </div>`;
                list.appendChild(row);
            });
        }

        function toggleCashbackUse(checked) {
            useCashback = checked;
            openCart();
        }

        function changeQty(productId, delta) {
            if (!cart[productId]) return;
            cart[productId].qty += delta;
            if (cart[productId].qty <= 0) delete cart[productId];
            updateCartBar();
            if (Object.keys(cart).length === 0) {
                loadProducts(currentPartnerId, currentPartnerName);
            } else {
                openCart();
            }
        }

        async function placeOrder() {
            const address = document.getElementById("delivery-address").value.trim();
            if (!address) { alert("Iltimos, yetkazish manzilini kiriting"); return; }
            const items = Object.values(cart).map(i => ({ product_id: i.product.id, quantity: i.qty }));
            try {
                const result = await api("/order", { 
                    partner_id: currentPartnerId, 
                    delivery_address: address, 
                    items,
                    use_cashback: useCashback 
                });
                document.getElementById("app").innerHTML = `
                    <div class="text-center py-16 card-bg rounded-3xl p-6 shadow-sm border my-4">
                        <div class="w-16 h-16 bg-green-50 text-green-500 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                            <i class="fa-solid fa-circle-check"></i>
                        </div>
                        <h2 class="text-xl font-black text-title mb-1">Buyurtma qabul qilindi!</h2>
                        <p class="text-xs text-sub font-medium mb-3">Buyurtma raqami: #${result.order_id}</p>
                        <p class="text-xs text-sub">Tez orada kuryerimiz siz bilan bog'lanadi.</p>
                    </div>`;
                document.getElementById("cart-bar").classList.add("hidden");
                cart = {};
                useCashback = false;
                if (tg) setTimeout(() => tg.close(), 3000);
            } catch (e) {
                alert("Xatolik: " + e.message);
            }
        }

        init();
    </script>
</body>
</html>
