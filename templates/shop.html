<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eltuvchi Express</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 antialiased selection:bg-indigo-500 selection:text-white pb-24">

    <!-- Asosiy konteyner -->
    <div id="app" class="max-w-md mx-auto p-4">
        <div id="loading" class="flex flex-col items-center justify-center py-20 space-y-3">
            <div class="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-sm text-gray-500 font-medium">Yuklanmoqda...</p>
        </div>
    </div>

    <!-- Pastda doim ko'rinadigan savat paneli -->
    <div id="cart-bar" class="hidden fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-indigo-600 text-white p-4 rounded-2xl shadow-xl flex justify-between items-center cursor-pointer transition-all duration-300 active:scale-95 z-50" onclick="openCart()">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-500 p-2 rounded-xl">
                <i class="fa-solid fa-cart-shopping text-lg"></i>
            </div>
            <div>
                <span id="cart-summary" class="font-bold text-sm block"></span>
                <span class="text-xs text-indigo-200">Savatni ko'rish uchun bosing</span>
            </div>
        </div>
        <span class="font-bold text-sm bg-white text-indigo-600 px-3 py-1.5 rounded-lg shadow-sm">Savat →</span>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }
        const initData = tg ? tg.initData : "";

        let currentCityId = null;
        let currentCityName = "Shaharni tanlang";
        let allCities = [];
        let currentPartnerId = null;
        let currentPartnerName = "";
        let products = [];
        let cart = {};

        async function api(path, body) {
            const res = await fetch(`/api/shop${path}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ init_data: initData, ...body }),
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({ detail: "Xatolik" }));
                throw new Error(err.detail || "Xatolik yuz berdi");
            }
            return res.json();
        }

        async function apiGet(path) {
            const res = await fetch(`/api/shop${path}`);
            if (!res.ok) throw new Error("Xatolik yuz berdi");
            return res.json();
        }

        function renderLoading(msg) {
            document.getElementById("app").innerHTML = `
                <div class="flex flex-col items-center justify-center py-20 space-y-3">
                    <div class="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-sm text-gray-500 font-medium">${msg}</p>
                </div>`;
        }

        function renderNeedsBotStart() {
            document.getElementById("app").innerHTML = `
                <div class="text-center py-16 bg-white rounded-3xl p-6 shadow-sm border border-gray-100 mt-6">
                    <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                        <i class="fa-solid fa-user-check"></i>
                    </div>
                    <p class="text-xl font-extrabold text-gray-900 mb-2">Xush kelibsiz!</p>
                    <p class="text-sm text-gray-600 mb-6 leading-relaxed">Davom etish uchun botga qaytib <b>telefon raqamingizni</b> ulashing.</p>
                    <div class="p-3 bg-indigo-50 rounded-xl text-xs text-indigo-700 font-medium">
                        Bot chatiga qaytib, "📱 Telefon raqamni ulashish" tugmasini bosing.
                    </div>
                </div>`;
        }

        async function init() {
            if (!tg || !initData) {
                renderLoading("Bu sahifa faqat Telegram ilovasi ichida ishlaydi.");
                return;
            }
            try {
                const me = await api("/me", {});
                if (!me.registered) {
                    renderNeedsBotStart();
                    return;
                }
                
                allCities = me.cities || [];

                if (!me.city_id) {
                    renderCitySelect(allCities);
                } else {
                    currentCityId = me.city_id;
                    const foundCity = allCities.find(c => c.id === currentCityId);
                    if (foundCity) currentCityName = foundCity.name;
                    await loadPartners();
                }
            } catch (e) {
                renderLoading("Xatolik: " + e.message);
            }
        }

        function renderCitySelect(cities) {
            document.getElementById("app").innerHTML = `
                <div class="mb-6">
                    <h1 class="text-2xl font-black text-gray-900 tracking-tight">📍 Shaharingizni tanlang</h1>
                    <p class="text-xs text-gray-500 mt-1">Xizmat ko'rsatish hududini belgilang</p>
                </div>
                <div class="space-y-2.5" id="city-list"></div>`;
            const list = document.getElementById("city-list");
            cities.forEach(c => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-4 bg-white active:bg-gray-50 rounded-2xl shadow-sm border border-gray-100 font-bold text-gray-800 flex justify-between items-center transition-all duration-200 active:scale-[0.99]";
                btn.innerHTML = `<span>${c.name}</span><i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>`;
                btn.onclick = async () => {
                    await api("/set-city", { city_id: c.id });
                    currentCityId = c.id;
                    currentCityName = c.name;
                    await loadPartners();
                };
                list.appendChild(btn);
            });
        }

        async function loadPartners() {
            renderLoading("Do'konlar yuklanmoqda...");
            const partners = await apiGet(`/partners?city_id=${currentCityId}`);
            const app = document.getElementById("app");
            
            app.innerHTML = `
                <!-- Shaharni almashtirish paneli -->
                <div class="flex justify-between items-center bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 mb-5">
                    <div class="flex items-center space-x-2.5 overflow-hidden">
                        <i class="fa-solid fa-location-dot text-indigo-600 text-lg"></i>
                        <span class="font-bold text-sm text-gray-800 truncate">${currentCityName}</span>
                    </div>
                    <button onclick="changeCityPrompt()" class="text-xs font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-xl transition-all">
                        O'zgartirish
                    </button>
                </div>

                <h1 class="text-xl font-black text-gray-900 mb-3">🏪 Muassasalar</h1>
                <div class="space-y-3" id="partner-list"></div>`;

            const list = document.getElementById("partner-list");
            if (partners.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl border border-dashed border-gray-200 p-4">
                        <i class="fa-solid fa-store-slash text-3xl text-gray-300 mb-2"></i>
                        <p class="text-sm text-gray-500 font-medium">Hozircha bu shaharda ochiq do'kon yo'q.</p>
                    </div>`;
                return;
            }
            partners.forEach(p => {
                const card = document.createElement("button");
                card.className = "w-full text-left p-4 bg-white rounded-2xl shadow-sm border border-gray-100 active:bg-gray-50 transition-all duration-200 active:scale-[0.99]";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <div class="font-extrabold text-base text-gray-900">${p.name}</div>
                        <span class="text-[10px] uppercase font-bold tracking-wider bg-gray-100 text-gray-600 px-2 py-0.5 rounded-md">${p.category || "Restoran"}</span>
                    </div>
                    <div class="text-xs text-gray-400 flex items-center space-x-1">
                        <i class="fa-solid fa-map-pin text-[10px]"></i>
                        <span class="truncate">${p.address || "Manzil ko'rsatilmagan"}</span>
                    </div>`;
                card.onclick = () => loadProducts(p.id, p.name);
                list.appendChild(card);
            });
        }

        async function changeCityPrompt() {
            if (allCities.length === 0) {
                try {
                    const me = await api("/me", {});
                    allCities = me.cities || [];
                } catch (e) {}
            }
            renderCitySelect(allCities);
        }

        async function loadProducts(partnerId, partnerName) {
            currentPartnerId = partnerId;
            currentPartnerName = partnerName;
            renderLoading("Menyu yuklanmoqda...");
            products = await apiGet(`/products?partner_id=${partnerId}`);
            const app = document.getElementById("app");
            app.innerHTML = `
                <button class="flex items-center text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-xl mb-4" onclick="loadPartners()">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i> Do'konlarga qaytish
                </button>
                <h1 class="text-2xl font-black text-gray-900 mb-4">${partnerName}</h1>
                <div class="space-y-3" id="product-list"></div>`;

            const list = document.getElementById("product-list");
            if (products.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl border border-dashed border-gray-200 p-4">
                        <i class="fa-solid fa-box-open text-3xl text-gray-300 mb-2"></i>
                        <p class="text-sm text-gray-500 font-medium">Bu do'konda hozircha mahsulot yo'q.</p>
                    </div>`;
            }
            products.forEach(p => {
                const row = document.createElement("div");
                row.className = "p-4 bg-white rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center space-x-3";
                row.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <div class="font-bold text-sm text-gray-900 truncate">${p.name}</div>
                        <div class="text-xs text-gray-400 line-clamp-2 mt-0.5">${p.description || ""}</div>
                        <div class="text-sm font-black text-indigo-600 mt-2">${p.price.toLocaleString()} so'm</div>
                    </div>
                    <button class="bg-indigo-600 active:bg-indigo-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow-md shadow-indigo-100 transition-all active:scale-95 flex-shrink-0" onclick='addToCart(${JSON.stringify(p)})'>
                        + Qo'shish
                    </button>`;
                list.appendChild(row);
            });
            updateCartBar();
        }

        function addToCart(product) {
            if (!cart[product.id]) cart[product.id] = { product, qty: 0 };
            cart[product.id].qty += 1;
            updateCartBar();
        }

        function updateCartBar() {
            const items = Object.values(cart);
            const bar = document.getElementById("cart-bar");
            if (items.length === 0) { bar.classList.add("hidden"); return; }
            const total = items.reduce((s, i) => s + i.product.price * i.qty, 0);
            const count = items.reduce((s, i) => s + i.qty, 0);
            document.getElementById("cart-summary").textContent = `${count} ta mahsulot — ${total.toLocaleString()} so'm`;
            bar.classList.remove("hidden");
        }

        function openCart() {
            const items = Object.values(cart);
            const app = document.getElementById("app");
            const total = items.reduce((s, i) => s + i.product.price * i.qty, 0);
            app.innerHTML = `
                <button class="flex items-center text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-xl mb-4" onclick="loadProducts(currentPartnerId, currentPartnerName)">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i> Menyuga qaytish
                </button>
                <h1 class="text-2xl font-black text-gray-900 mb-4">🛒 Savatingiz</h1>
                <div class="space-y-2.5 mb-5" id="cart-items"></div>
                
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-5 space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1.5">Yetkazib berish manzili</label>
                        <input id="delivery-address" type="text" placeholder="Masalan: Navoiy ko'chasi, 12-uy" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 transition-all">
                    </div>
                    <div class="border-t border-gray-100 pt-3 flex justify-between items-center font-bold">
                        <span class="text-sm text-gray-600">Jami summa:</span>
                        <span class="text-lg text-indigo-600 font-black">${total.toLocaleString()} so'm</span>
                    </div>
                </div>

                <button onclick="placeOrder()" class="w-full bg-green-600 active:bg-green-700 text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-green-100 transition-all active:scale-[0.98] flex justify-center items-center space-x-2">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>Buyurtmani tasdiqlash</span>
                </button>`;

            const list = document.getElementById("cart-items");
            items.forEach(i => {
                const row = document.createElement("div");
                row.className = "p-3.5 bg-white rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center";
                row.innerHTML = `
                    <div class="text-sm font-bold text-gray-800">${i.product.name}</div>
                    <div class="flex items-center space-x-2">
                        <button class="w-8 h-8 bg-gray-100 active:bg-gray-200 rounded-xl font-bold text-gray-700 transition-all flex items-center justify-center" onclick="changeQty(${i.product.id}, -1)">−</button>
                        <span class="text-sm font-bold w-6 text-center text-gray-900">${i.qty}</span>
                        <button class="w-8 h-8 bg-gray-100 active:bg-gray-200 rounded-xl font-bold text-gray-700 transition-all flex items-center justify-center" onclick="changeQty(${i.product.id}, 1)">+</button>
                    </div>`;
                list.appendChild(row);
            });
        }

        function changeQty(productId, delta) {
            if (!cart[productId]) return;
            cart[productId].qty += delta;
            if (cart[productId].qty <= 0) delete cart[productId];
            updateCartBar();
            if (Object.keys(cart).length === 0) {
                loadProducts(currentPartnerId, currentPartnerName);
            } else {
                openCart();
            }
        }

        async function placeOrder() {
            const address = document.getElementById("delivery-address").value.trim();
            if (!address) { alert("Iltimos, yetkazish manzilini kiriting"); return; }
            const items = Object.values(cart).map(i => ({ product_id: i.product.id, quantity: i.qty }));
            try {
                const result = await api("/order", { partner_id: currentPartnerId, delivery_address: address, items });
                document.getElementById("app").innerHTML = `
                    <div class="text-center py-16 bg-white rounded-3xl p-6 shadow-sm border border-gray-100 mt-6">
                        <div class="w-16 h-16 bg-green-50 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                            <i class="fa-solid fa-circle-check"></i>
                        </div>
                        <p class="text-2xl font-black text-gray-900 mb-1">Buyurtma qabul qilindi!</p>
                        <p class="text-xs text-gray-400 font-medium mb-4">Buyurtma raqami: #${result.order_id}</p>
                        <p class="text-xs text-gray-500">Tez orada kuryerimiz siz bilan bog'lanadi.</p>
                    </div>`;
                document.getElementById("cart-bar").classList.add("hidden");
                cart = {};
                if (tg) setTimeout(() => tg.close(), 3000);
            } catch (e) {
                alert("Xatolik: " + e.message);
            }
        }

        init();
    </script>
</body>
</html>
