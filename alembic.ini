[alembic]
script_location = alembic

# DIQQAT: sqlalchemy.url shu yerda YOZILMAGAN — bu ataylab shunday, chunki
# haqiqiy manzil (parol bilan) database.py orqali .env fayldan o'qiladi
# (alembic/env.py faylida). Bu yerga hech qachon parolni yozmang.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
